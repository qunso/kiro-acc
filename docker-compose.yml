services:
  kiro-acc:
    build: .
    image: kiro-acc:local
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: /data
      API_KEY: ${API_KEY:-change-me-api-key}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      ACCOUNT_STRATEGY: ${ACCOUNT_STRATEGY:-round-robin}
      PREFERRED_ENDPOINT: ${PREFERRED_ENDPOINT:-codewhisperer}
    volumes:
      - kiro-acc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kiro-acc-data:
